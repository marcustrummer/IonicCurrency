<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Conversor de Moedas</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="converter-container">
    
    <div class="input-section">
      <ion-item>
        <ion-input [(ngModel)]="inputValue" (ionInput)="onInputChange($event)" placeholder="Digite o valor" type="number" inputmode="decimal" min="0" step="any"></ion-input>
        <ion-select [(ngModel)]="fromCurrency" (ionChange)="onFromCurrencyChange()">
        </ion-select>
      </ion-item>
    </div>

    <ion-icon name="swap-horizontal-outline" class="swap-icon" (click)="onSwapCurrencies()"></ion-icon>

    <div class="output-section">
      <ion-item>
        <ion-input [value]="formattedOutputValue" readonly></ion-input>
        <ion-select [(ngModel)]="toCurrency" (ionChange)="onToCurrencyChange()">
        </ion-select>
      </ion-item>
    </div>
    
    <div class="button">
      <ion-button (click)="saveTransaction()">Salvar valor</ion-button>
    </div>

    <div class="chart-container">
      <canvas id="currencyChart"></canvas>
    </div>
  </div>
</ion-content>
